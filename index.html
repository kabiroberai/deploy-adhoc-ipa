<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Install $title</title>
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; --accent: #0071e3; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #000; --card: #1c1c1e; --accent: #2997ff; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    main { box-sizing: border-box; width: min(100% - 32px, 400px); padding: 32px 24px; border-radius: 20px;
           background: var(--card); text-align: center; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .meta { margin: 0; color: var(--muted); font-size: 14px; }
    .install { display: block; margin: 24px 0 16px; padding: 14px; border-radius: 12px; background: var(--accent);
               color: #fff; font-weight: 600; text-decoration: none; }
    .note { margin: 0; color: var(--muted); font-size: 13px; }
    #qr { display: none; margin: 24px auto 8px; border-radius: 12px; }
    .desktop #qr { display: block; }
    .desktop .install { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>$title</h1>
    <p class="meta">$version &middot; $bundle_id</p>
    <p class="meta">$commit</p>
    <p class="meta">Link expires $expires</p>
    <a class="install" href="$install_url">Install</a>
    <img id="qr" src="qr.svg" width="200" height="200" alt="QR code for the install link">
  </main>
  <script>
    if (!/iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) {
      document.documentElement.classList.add("desktop");
    }
  </script>
</body>
</html>
